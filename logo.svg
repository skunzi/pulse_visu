<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)" fill="#88f47d">
    <!-- Left bracket [ : rows are 3, 2, 1, 1, 2, 3 squares wide -->
    <g>
      <!-- Row 1: 3 squares -->
      <rect x="60" y="22" width="20" height="20" rx="3"/>
      <rect x="84" y="22" width="20" height="20" rx="3"/>
      <rect x="108" y="22" width="20" height="20" rx="3"/>
      <!-- Row 2: 2 squares -->
      <rect x="60" y="46" width="20" height="20" rx="3"/>
      <rect x="84" y="46" width="20" height="20" rx="3"/>
      <!-- Row 3: 1 square -->
      <rect x="60" y="70" width="20" height="20" rx="3"/>
      <!-- Row 4: 1 square -->
      <rect x="60" y="94" width="20" height="20" rx="3"/>
      <!-- Row 5: 2 squares -->
      <rect x="60" y="118" width="20" height="20" rx="3"/>
      <rect x="84" y="118" width="20" height="20" rx="3"/>
      <!-- Row 6: 3 squares -->
      <rect x="60" y="142" width="20" height="20" rx="3"/>
      <rect x="84" y="142" width="20" height="20" rx="3"/>
      <rect x="108" y="142" width="20" height="20" rx="3"/>
    </g>

    <!-- Right bracket ] : mirrored, rows 3, 2, 1, 1, 2, 3 -->
    <g>
      <!-- Row 1: 3 squares -->
      <rect x="670" y="22" width="20" height="20" rx="3"/>
      <rect x="694" y="22" width="20" height="20" rx="3"/>
      <rect x="718" y="22" width="20" height="20" rx="3"/>
      <!-- Row 2: 2 squares -->
      <rect x="694" y="46" width="20" height="20" rx="3"/>
      <rect x="718" y="46" width="20" height="20" rx="3"/>
      <!-- Row 3: 1 square -->
      <rect x="718" y="70" width="20" height="20" rx="3"/>
      <!-- Row 4: 1 square -->
      <rect x="718" y="94" width="20" height="20" rx="3"/>
      <!-- Row 5: 2 squares -->
      <rect x="694" y="118" width="20" height="20" rx="3"/>
      <rect x="718" y="118" width="20" height="20" rx="3"/>
      <!-- Row 6: 3 squares -->
      <rect x="670" y="142" width="20" height="20" rx="3"/>
      <rect x="694" y="142" width="20" height="20" rx="3"/>
      <rect x="718" y="142" width="20" height="20" rx="3"/>
    </g>

    <!-- Text: larger to fill the space between brackets -->
    <text x="400" y="120" text-anchor="middle"
          font-family="'JetBrains Mono', 'Fira Code', 'Source Code Pro', 'Courier New', monospace"
          font-size="72" fill="#88f47d">offclock.dev</text>
  </g>
</svg>
